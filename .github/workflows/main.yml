name: Build PACIFIC VICE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev

      - name: Extract project
        run: |
          mkdir project
          unzip -q PACIFIC_VICE_Python_Full_Starter.zip -d project

      - name: Install Buildozer
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install buildozer cython

      - name: Build APK
        run: |
          SPEC=$(find project -name buildozer.spec -print -quit)
          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi
          cd "$(dirname "$SPEC")"
          ~/.local/bin/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PACIFIC-VICE-APK
          path: project/**/bin/*.apk
          if-no-files-found: error
